<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Creator-Portfolio Template </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/git.ignore/images/inspos/logo.png">
</head>
<body>
    
    <div class="container">
<!--Just the nav-bar contents-->
        <nav>

            <img src="/git.ignore/images/inspos/logo.png" alt="">

            <div class="navLinks">
                
                <a class="navLink active" data-section="home">Home</a>
                <a class="navLink" data-section="about">About Me</a>
                <a class="navLink" data-section="projects">Projects</a>
                <a class="navLink" data-section="services">Services</a>
                <a class="navLink" data-section="contact">Contact Me</a>

                <div class="underline"></div>
                
            </div>

            <button>Work Together</button>


        </nav>
     
      <main>


<!--Contains the page contents-->
         <!--This is the Home section-->
            <section id="home" class="section activeSection">

                <div class="text">
                   <p>Hello,</p>
                   <p>I am <span>Patience Jelagat</span></p>
                   <h1>UI/UX Designer</h1>
                </div>

                <div class="mediaLinks">
                    
                    <a href=""><img src="/git.ignore/images/icons/email.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/github.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/instagram (1).png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/linkedin.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/twitter.png" alt=""></a>
                </div>

                <div class="buttons">
                    <button>Work Together</button>
                    <button>View Resume</button>
                </div>

            </section> 

            <!--This is the About Me section-->
            <section id="about" class="section">
                <h1>About section</h1>
            </section>

            <!--This is the Projects section-->
            <section id="projects" class="section">
                <h1>Projects section</h1>
            </section>

            <!--This is the Services section-->
            <section id="services" class="section">
                <h1>Services section</h1>
            </section>

            <!--This is the Contact Me section-->
            <section id="contact" class="section">

                <div class="mediaLinks">
                    <h2>My Socials:</h2>
                    <a href=""><img src="/git.ignore/images/icons/email.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/github.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/instagram (1).png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/linkedin.png" alt=""></a>
                    <a href=""><img src="/git.ignore/images/icons/twitter.png" alt=""></a>
                </div>

                <form action="submit">
                    <h2>Please fill the form below:</h2>
                    <label for="name">Please enter your name/business:</label>
                    <input type="text" placeholder="'e.g Nyota Meats'" required>
                    <label for="email">Please enter contact email: </label>
                    <input type="Email" placeholder="'e.g nyotameats@gmail.com'" required>
                    <label for="textarea">What service do you need?:</label>
                    <textarea name="" id="textarea" required  maxlength="500" placeholder="Describe the type of website, features, colors, or functionality you want." ></textarea>
                    <p>Character count:<span id="count">0</span>/500</p>
                    <button id="send">Submit</button>

                </form>

            </section>


      </main>

    </div>


    <script src="/JS/script.js"></script>
    <script src="JS/form.js"></script>
</body>
</html>
